name: goexchange-prod

services:
  postgres:
    image: postgres:18-alpine
    container_name: goexchange-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - goexchange-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - goexchange-prod

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/go-exchange-project/go-exchange-back:latest}
    container_name: goexchange-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GIN_MODE: release
      GOEXCHANGE_DB_HOST: postgres
      GOEXCHANGE_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      GOEXCHANGE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GOEXCHANGE_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      GOEXCHANGE_DB_PORT: "5432"
      GOEXCHANGE_DB_SSLMODE: disable
      GOEXCHANGE_DB_CONNECT_TIMEOUT: "10"
      GOEXCHANGE_JWT_SECRET: ${GOEXCHANGE_JWT_SECRET:?GOEXCHANGE_JWT_SECRET is required}
      GOEXCHANGE_MARKET_RULES_PATH: /app/config/market_rules.json
      GOEXCHANGE_MIGRATIONS_DIR: /app/migrations
      GOEXCHANGE_ENABLE_DEV_TOOLS: ${GOEXCHANGE_ENABLE_DEV_TOOLS:-false}
      GOEXCHANGE_DEV_TOOLS_TOKEN: ${GOEXCHANGE_DEV_TOOLS_TOKEN:-}
      GOEXCHANGE_ENABLE_UPBIT: ${GOEXCHANGE_ENABLE_UPBIT:-false}
      GOEXCHANGE_CORS_ALLOWED_ORIGINS: ${GOEXCHANGE_CORS_ALLOWED_ORIGINS:?GOEXCHANGE_CORS_ALLOWED_ORIGINS is required}
      GOEXCHANGE_WS_ALLOWED_ORIGINS: ${GOEXCHANGE_WS_ALLOWED_ORIGINS:?GOEXCHANGE_WS_ALLOWED_ORIGINS is required}
      # 설계 §7 — 컨테이너에서는 0.0.0.0으로 바인드해야 포트 포워딩이 닿는다.
      # 미공개(published 없음)라 호스트 밖에서는 접근할 수 없다.
      GOEXCHANGE_ADMIN_ADDR: ${GOEXCHANGE_ADMIN_ADDR:-0.0.0.0:9101}
      # 설계 §2·§3·§6 — 운영 시간 상한·rate limit. .env.*.example과 키가 1:1로
      # 대응한다(compose가 계약이다 — env_file은 쓰지 않는다).
      GOEXCHANGE_HTTP_READ_HEADER_TIMEOUT: ${GOEXCHANGE_HTTP_READ_HEADER_TIMEOUT:-5s}
      GOEXCHANGE_HTTP_READ_TIMEOUT: ${GOEXCHANGE_HTTP_READ_TIMEOUT:-15s}
      GOEXCHANGE_HTTP_WRITE_TIMEOUT: ${GOEXCHANGE_HTTP_WRITE_TIMEOUT:-20s}
      GOEXCHANGE_HTTP_IDLE_TIMEOUT: ${GOEXCHANGE_HTTP_IDLE_TIMEOUT:-60s}
      GOEXCHANGE_HTTP_MAX_HEADER_BYTES: ${GOEXCHANGE_HTTP_MAX_HEADER_BYTES:-1048576}
      GOEXCHANGE_DB_STATEMENT_TIMEOUT: ${GOEXCHANGE_DB_STATEMENT_TIMEOUT:-15s}
      GOEXCHANGE_DB_LOCK_TIMEOUT: ${GOEXCHANGE_DB_LOCK_TIMEOUT:-3s}
      GOEXCHANGE_DB_IDLE_TX_TIMEOUT: ${GOEXCHANGE_DB_IDLE_TX_TIMEOUT:-30s}
      GOEXCHANGE_ADMIN_WRITE_TIMEOUT: ${GOEXCHANGE_ADMIN_WRITE_TIMEOUT:-120s}
      GOEXCHANGE_RATE_LIMIT_ENABLED: ${GOEXCHANGE_RATE_LIMIT_ENABLED:-true}
      GOEXCHANGE_AUTH_RATE_LIMIT_RPS: ${GOEXCHANGE_AUTH_RATE_LIMIT_RPS:-1}
      GOEXCHANGE_AUTH_RATE_LIMIT_BURST: ${GOEXCHANGE_AUTH_RATE_LIMIT_BURST:-10}
      GOEXCHANGE_ORDER_RATE_LIMIT_RPS: ${GOEXCHANGE_ORDER_RATE_LIMIT_RPS:-20}
      GOEXCHANGE_ORDER_RATE_LIMIT_BURST: ${GOEXCHANGE_ORDER_RATE_LIMIT_BURST:-40}
      GOEXCHANGE_TRANSFER_RATE_LIMIT_RPS: ${GOEXCHANGE_TRANSFER_RATE_LIMIT_RPS:-2}
      GOEXCHANGE_TRANSFER_RATE_LIMIT_BURST: ${GOEXCHANGE_TRANSFER_RATE_LIMIT_BURST:-5}
      GOEXCHANGE_TRUSTED_PROXIES: ${GOEXCHANGE_TRUSTED_PROXIES:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - goexchange-prod

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/go-exchange-project/go-exchange-front:latest}
    container_name: goexchange-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - goexchange-prod

networks:
  goexchange-prod:
    name: goexchange-prod

volumes:
  goexchange-prod-postgres-data:
